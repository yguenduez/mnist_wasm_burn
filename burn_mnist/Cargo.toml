[package]
name = "burn_mnist"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
burn = { version = "0.19.1", default-features = false, features = ["ndarray"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3.4", features = ["wasm_js"], default-features = false }
js-sys = "0.3.83"
ndarray = "0.17.1"
serde = "1.0.228"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.56"
